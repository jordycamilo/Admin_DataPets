<section class="quienes-somos-container">
  <div class="modal-header justify-content-center"
       style="background-color: #0082ca; border-top-left-radius: 10px; border-top-right-radius: 10px;">
    <h2 class="modal-title text-white w-100 text-center">Equipo DataPets</h2>
  </div>

  <div class="modal-body p-4">
    <div *ngFor="let m of miembros" class="member d-flex align-items-center mb-5"
         [ngClass]="{'flex-row-reverse': m.id % 2 === 0}">
      
      <!-- vista normal -->
      <ng-container *ngIf="!m.editando">
        <img [src]="m.imagen" class="member-img me-4 rounded" [alt]="m.alt" />
        <div>
          <h3 class="mb-0">{{ m.nombre }}</h3>
          <p class="text-muted mb-1">{{ m.rol }}</p>
          <p>{{ m.descripcion }}</p>
          <button (click)="editar(m)">Editar</button>
        </div>
      </ng-container>

      <!-- vista edición -->
      <ng-container *ngIf="m.editando">
        <div class="d-flex">
          <div class="w-25">
            <label class="form-label">URL Imagen</label>
            <input type="text" [(ngModel)]="m.imagen" class="form-control mb-2" />
            <label class="form-label">Alt text</label>
            <input type="text" [(ngModel)]="m.alt" class="form-control mb-2" />
          </div>
          <div class="w-75 ps-3">
            <label class="form-label">Nombre</label>
            <input type="text" [(ngModel)]="m.nombre" class="form-control mb-2" />
            <label class="form-label">Rol</label>
            <input type="text" [(ngModel)]="m.rol" class="form-control mb-2" />
            <label class="form-label">Descripción</label>
            <textarea rows="3" [(ngModel)]="m.descripcion" class="form-control"></textarea>
            <div class="mt-2">
              <button (click)="guardar(m)">Guardar</button>
              <button (click)="cancelar(m)">Cancelar</button>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</section>
