<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Gestión de Usuarios</h2>
  <button class="btn btn-primary" (click)="abrirModal()">Crear Usuario</button>
</div>

<div class="table-responsive">
  <table class="table table-striped table-bordered">
    <thead class="table-primary">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody *ngIf="usuarios.length; else sinUsuarios">
      <tr *ngFor="let usuario of usuarios">
        <td>{{ usuario.id }}</td>
        <td>{{ usuario.nombre }}</td>
        <td>{{ usuario.correo }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2" (click)="editarUsuario(usuario)">Editar</button>
          <button class="btn btn-sm btn-danger" (click)="eliminarUsuario(usuario.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<ng-template #sinUsuarios>
  <tr>
    <td colspan="4" class="text-center text-muted">No hay usuarios registrados.</td>
  </tr>
</ng-template>

<!-- Modal -->
<div class="modal fade" tabindex="-1" id="usuarioModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ usuarioSeleccionado.id ? 'Editar Usuario' : 'Crear Usuario' }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form #usuarioForm="ngForm">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input id="nombre" name="nombre" [(ngModel)]="usuarioSeleccionado.nombre" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo</label>
            <input id="correo" name="correo" [(ngModel)]="usuarioSeleccionado.correo" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono</label>
            <input id="telefono" name="telefono" [(ngModel)]="usuarioSeleccionado.telefono" class="form-control" />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" (click)="guardarUsuario()">Guardar</button>
      </div>
    </div>
  </div>
</div>
