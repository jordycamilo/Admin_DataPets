<div class="config-container">
  <h2>Configuración</h2>

  <div class="config-item">
    <label for="idioma">Idioma:</label>
    <select id="idioma" [(ngModel)]="settings.idioma">
      <option value="es">Español</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="config-item">
    <label>Tema:</label>
    <button (click)="toggleTema()">
      {{ settings.tema === 'light' ? 'Claro' : 'Oscuro' }}
    </button>
  </div>

  <div class="config-item">
    <label for="notificaciones">Notificaciones:</label>
    <input
      id="notificaciones"
      type="checkbox"
      [(ngModel)]="settings.notificaciones"
    />
  </div>

  <div class="botones">
    <button (click)="guardar()">Guardar</button>
    <button (click)="cancelar()">Cancelar</button>
    <button (click)="resetear()">Restablecer</button>
  </div>
</div>
